# docker-wyze-bridge: local RTSP/snapshot access to Wyze cams (unofficial).
# Get a free API key/id at https://developer-api-console.wyze.com/#/apikey/view
# then:  docker compose -f wyze-bridge.compose.yml up -d
# Snapshots refresh from the RTSP stream every 30s; the worker reads
# http://<pi>:5000/snapshot/<cam-name>.jpg
services:
  wyze-bridge:
    image: mrlt8/wyze-bridge:latest
    container_name: wyze-bridge
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      - "5000:5000" # web UI + snapshots
    environment:
      - WYZE_EMAIL=${WYZE_EMAIL}
      - WYZE_PASSWORD=${WYZE_PASSWORD}
      - API_ID=${WYZE_API_ID}
      - API_KEY=${WYZE_API_KEY}
      - SNAPSHOT=RTSP30
      # LAN-only by default. Set WB_AUTH=True and copy the WB_API key from the
      # web UI into the worker's WYZE_BRIDGE_API_KEY to require auth.
      - WB_AUTH=False
